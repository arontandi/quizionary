<div class="auth wrap">
  <section class="card auth-card">
    <h1 class="title">Welcome back!</h1>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()" class="form" novalidate>
      <div class="form-group">
        <label for="email" class="qhead">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          placeholder="you@example.com"
        />
      </div>

      <div class="form-group">
        <label for="password" class="qhead">Password</label>
        <div class="input-wrap">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            class="has-action"
          />
          <button
            type="button"
            class="input-action"
            (click)="showPassword = !showPassword"
            [attr.aria-pressed]="showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary lg block" [disabled]="loading || loginForm?.invalid">
          <span class="spinner" *ngIf="loading" aria-hidden="true"></span>
          {{ loading ? 'Signing in…' : 'Login' }}
        </button>
      </div>

      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    </form>
  </section>

  <section class="card next-steps">
    <div class="row space-between">
      <div>
        <div class="qhead">New here?</div>
        <p class="muted">Create an account to generate and share quizzes.</p>
      </div>
      <a routerLink="/register" class="btn">Register</a>
    </div>
  </section>
</div>
